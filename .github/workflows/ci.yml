name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: pytest (Ubuntu, Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies (locked)
        run: uv sync --frozen --dev

      - name: Run the suite
        run: uv run pytest
